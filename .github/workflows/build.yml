name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Make Gradle Wrapper executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Generate Persistent Signing Keystore
        run: |
          if [ ! -f "app/keystore.jks" ]; then
            keytool -genkeypair -v \
              -keystore app/keystore.jks \
              -alias kishka \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass kishkapassword \
              -keypass kishkapassword \
              -dname "CN=KishkaMessenger, OU=Dev, O=Kishka, L=Ternopil, C=UA"
          fi

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --warning-mode summary

      - name: Save APK into repository
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            mkdir -p apk
            cp app/build/outputs/apk/debug/app-debug.apk apk/KishkaMessenger_V3.5.apk
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/keystore.jks apk/KishkaMessenger_V3.5.apk
            git diff --staged --quiet || (git commit -m "Auto-build: update KishkaMessenger_V3.5.apk and keystore [skip ci]" && git push)
          else
            echo "❌ Помилка: APK не знайдено після кроку збірки!"
            exit 1
          fi
