name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Надаємо права на автоматичний commit у репозиторій
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare APK folder
      run: |
        mkdir -p apk
        cp app/build/outputs/apk/debug/app-debug.apk apk/KishkaMessangerV1.2.apk

    - name: Commit and push APK to repository
      if: github.event_name == 'push'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-build: add KishkaMessangerV1.2.apk"
        file_pattern: 'apk/*.apk'
