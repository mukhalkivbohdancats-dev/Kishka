name: Build Kishka Messenger APK V1.1

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Надання прав на виконання gradlew
        run: chmod +x gradlew

      - name: Збірка APK (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Створення папки V1.1 та підготовка APK
        run: |
          mkdir -p V1.1
          cp app/build/outputs/apk/debug/app-debug.apk V1.1/KishkaMessenger_V1.1.apk

      - name: Завантаження артефакту V1.1
        uses: actions/upload-artifact@v4
        with:
          name: KishkaMessenger_V1.1
          path: V1.1/KishkaMessenger_V1.1.apk
