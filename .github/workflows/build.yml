# Збирання РЕЛІЗНОГО (підписаного) APK Kishka Messenger.
# Ключ підпису й паролі лежать у GitHub Secrets (Settings -> Secrets and variables -> Actions), а не в репозиторії:
#   KEYSTORE_BASE64    — файл keystore.jks, закодований в base64 (див. інструкцію: base64 -w0 keystore.jks)
#   KEYSTORE_PASSWORD  — пароль сховища ключів
#   KEY_ALIAS          — псевдонім ключа
#   KEY_PASSWORD       — пароль ключа
name: Build Android App (release)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'apk/**'
      - 'web/**'
      - 'calls/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Make Gradle Wrapper executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Prepare signing key from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не задано один зі Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Див. інструкцію (розділ про підпис)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kishka-release.jks"
          echo "KISHKA_KEYSTORE_FILE=$RUNNER_TEMP/kishka-release.jks" >> "$GITHUB_ENV"
          echo "KISHKA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KISHKA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KISHKA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace --warning-mode summary

      - name: Verify the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then echo "::error::Підписаний APK не створився (є лише app-release-unsigned.apk?)"; ls app/build/outputs/apk/release || true; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Save APK into repository
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/KishkaMessenger_V6.6.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/KishkaMessenger_V6.6.apk
          git diff --staged --quiet || (git commit -m "Auto-build: release KishkaMessenger_V6.6.apk [skip ci]" && git push)
