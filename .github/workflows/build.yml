name: Build Kishka Messenger APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare App Icon from app-image.jpg
      run: |
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        if [ -f "app-image.jpg" ]; then
          cp app-image.jpg app/src/main/res/mipmap-mdpi/ic_launcher.jpg
          cp app-image.jpg app/src/main/res/mipmap-hdpi/ic_launcher.jpg
          cp app-image.jpg app/src/main/res/mipmap-xhdpi/ic_launcher.jpg
          cp app-image.jpg app/src/main/res/mipmap-xxhdpi/ic_launcher.jpg
          cp app-image.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KishkaMessenger-APK
        path: app/build/outputs/apk/debug/app-debug.apk
