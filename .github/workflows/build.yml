name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Надаємо права боту для збереження файлів у репозиторій
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Gradle Wrapper if missing & set permissions
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Save APK to repository branch
      run: |
        mkdir -p apk
        cp app/build/outputs/apk/debug/app-debug.apk apk/KishkaMessenger.apk
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apk/KishkaMessenger.apk
        if git diff --staged --quiet; then
          echo "Змін у APK немає, комміт не потрібен."
        else
          git commit -m "auto: update APK in apk/ directory [skip ci]"
          git push
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KishkaMessenger-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
