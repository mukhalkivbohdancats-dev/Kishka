name: Re-password old key (one time)
on: workflow_dispatch
jobs:
  repass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NEW_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$NEW_PASS" ]; then echo "::error::Create secret KEYSTORE_PASSWORD first"; exit 1; fi
          cp app/keystore.jks /tmp/new.jks
          keytool -storepasswd -keystore /tmp/new.jks -storepass kishkapassword -new "$NEW_PASS"
          {
            echo '## KEYSTORE_BASE64'
            echo '```'
            base64 -w 0 /tmp/new.jks
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
