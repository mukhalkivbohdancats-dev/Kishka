# Покладіть цей файл у репозиторій KishkaBlox.github.io як .github/workflows/pages.yml.
# Він забирає код з основного репозиторію Kishka (має бути публічним) і публікує ОБИДВА сайти одним розгортанням:
#   https://kishkablox.github.io/                    — KishkaBlox (вхід і гра в браузері)
#   https://kishkablox.github.io/messenger/          — Kishka Messenger (сторінка завантаження)
#   https://kishkablox.github.io/messenger/ID/153663 — посилання на профіль: показує ім'я й аватарку та відкриває застосунок Android
# Оновлення: Actions -> «Сайти KishkaBlox і Kishka Messenger» -> Run workflow (або само щодоби о 03:00 UTC, і при кожному push).
name: Сайти KishkaBlox і Kishka Messenger (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mukhalkivbohdancats-dev/Kishka
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Зібрати обидва сайти (KishkaBlox + Kishka Messenger)
        run: node src/web/build-site.js --src src --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
