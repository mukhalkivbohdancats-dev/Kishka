<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Realistic cars</title>
<style>
  :root {
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #8fc2f5;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  canvas#c, canvas#tags { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #tags { pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- Джойстик (зліва знизу) і стрибок (справа знизу) ---------- */
  #stick {
    position: fixed; left: calc(var(--safe-l) + 30px); bottom: calc(var(--safe-b) + 22px);
    width: clamp(92px, 32vh, 128px); height: clamp(92px, 32vh, 128px);
    border-radius: 50%; background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.38); touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%;
    border-radius: 50%; background: rgba(255,255,255,0.52); border: 2px solid rgba(255,255,255,0.7); will-change: transform;
  }
  #jump {
    position: fixed; right: calc(var(--safe-r) + 30px); bottom: calc(var(--safe-b) + 30px);
    width: 88px; height: 88px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.45); touch-action: none;
  }
  #jump.down { background: rgba(255,255,255,0.42); }
  .ico { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); pointer-events: none; }

  /* ---------- Кнопка «Cars» (зліва приблизно посередині) ---------- */
  #carsBtn {
    position: fixed; left: calc(var(--safe-l) + 12px); top: calc(50% - 30px);
    width: 62px; height: 62px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.5);
    background: linear-gradient(160deg, rgba(60,70,95,0.78), rgba(25,30,45,0.78));
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; font-weight: 700; letter-spacing: .2px; padding: 0; touch-action: manipulation; cursor: pointer;
  }
  #carsBtn svg { width: 32px; height: 22px; }
  #carsBtn:active { transform: scale(0.93); }

  /* ---------- Вікно вибору машин: велике плаваюче, напівпрозоре, по центру, НЕ на весь екран ---------- */
  #carsPanel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(94vw, 1040px); height: min(88vh, 640px); box-sizing: border-box;
    padding: 14px 18px 16px; border-radius: 28px;
    display: flex; flex-direction: column; gap: 10px;
    background: rgba(16, 19, 28, 0.62);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255,255,255,0.3); box-shadow: 0 14px 50px rgba(0,0,0,0.5);
    color: #fff; touch-action: pan-y; z-index: 20;
    animation: pop .2s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.96); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  #carsHead { position: relative; flex: none; height: 46px; display: flex; align-items: center; justify-content: center; }
  #carsTitle { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  #carsClose {
    position: absolute; left: 0; top: 1px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85);
    background: #e5484d; color: #fff; font-size: 22px; font-weight: 900; line-height: 1; padding: 0; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  #carsClose:active { transform: scale(0.92); }
  #carsList { flex: 1 1 auto; min-height: 0; display: flex; gap: 14px; align-items: stretch; overflow-x: auto; overflow-y: hidden; padding: 2px; }
  .card {
    flex: 1 1 0; min-width: 190px; box-sizing: border-box; padding: 12px; border-radius: 22px;
    background: rgba(255,255,255,0.10); border: 2.5px solid rgba(255,255,255,0.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; touch-action: manipulation;
    transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; min-height: 0;
  }
  .card.sel { background: rgba(255,255,255,0.22); border-color: #4be36b; transform: translateY(-3px); box-shadow: 0 0 0 3px rgba(75,227,107,0.28), 0 8px 22px rgba(0,0,0,0.35); }
  .card .pvw { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .card img.pv { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card .nm { flex: none; display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; }
  .card .nm svg { width: 30px; height: 19px; flex: none; }
  .card .ht { flex: none; font-size: 13px; opacity: .82; text-align: center; min-height: 16px; }
  .card .st { flex: none; font-size: 12px; font-weight: 700; color: #9bf0ad; min-height: 15px; }

  /* Велика зелена кнопка Spawn: пульсує й «блищить», вдавлюється при натисканні */
  #spawnBtn {
    position: relative; flex: none; width: 100%; height: clamp(50px, 10vh, 68px); border: 0; border-radius: 20px; overflow: hidden;
    font-size: clamp(19px, 3.4vh, 25px); font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #fff; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(180deg, #4ee06a, #1fae3d);
    box-shadow: 0 5px 0 #137a2a, 0 10px 22px rgba(0,0,0,0.38);
    text-shadow: 0 2px 3px rgba(0,0,0,0.35);
    animation: spawnPulse 1.5s ease-in-out infinite;
    transition: transform .08s, box-shadow .08s;
  }
  #spawnBtn::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-18deg); animation: spawnShine 2.4s ease-in-out infinite;
  }
  #spawnBtn:active, #spawnBtn.pressed { transform: translateY(4px) scale(0.985); box-shadow: 0 1px 0 #137a2a, 0 4px 10px rgba(0,0,0,0.35); }
  @keyframes spawnPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
  @keyframes spawnShine { 0% { left: -60%; } 55%, 100% { left: 130%; } }

  /* ---------- Спідометр: між кнопками повороту (ліворуч) і газу (праворуч) ---------- */
  #speedo {
    position: fixed; left: 50%; bottom: calc(var(--safe-b) + 14px); transform: translateX(-50%);
    width: clamp(116px, calc(100vw - 460px), 214px); aspect-ratio: 200 / 176; display: none; pointer-events: none; z-index: 5;
  }
  body.driving #speedo { display: block; }
  #speedo svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #spdBg { fill: rgba(10,14,24,0.5); }
  #spdTrack { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 11; stroke-linecap: round; }
  #spdBar { fill: none; stroke: #5bd36f; stroke-width: 11; stroke-linecap: round; }
  #spdNum { fill: #fff; font-weight: 800; font-size: 56px; text-anchor: middle; font-family: inherit; }
  #spdUnit { fill: rgba(255,255,255,0.82); font-weight: 700; font-size: 15px; text-anchor: middle; letter-spacing: 1px; }
  #spdGear { fill: #ffd24a; font-weight: 800; font-size: 19px; text-anchor: middle; }
  .spdTick { stroke: rgba(255,255,255,0.5); stroke-width: 2; }

  /* ---------- Керування машиною ---------- */
  .ctl {
    position: fixed; border-radius: 50%; display: none; touch-action: none;
    background: rgba(255,255,255,0.20); border: 2px solid rgba(255,255,255,0.5);
  }
  .ctl.down { background: rgba(255,255,255,0.46); }
  body.driving .ctl { display: block; }
  #gas { right: calc(var(--safe-r) + 22px); bottom: calc(var(--safe-b) + 22px); width: 96px; height: 96px; background: rgba(80,210,110,0.30); border-color: rgba(150,255,170,0.8); }
  #gas.down { background: rgba(80,210,110,0.62); }
  #rev { right: calc(var(--safe-r) + 134px); bottom: calc(var(--safe-b) + 22px); width: 80px; height: 80px; }
  #left { left: calc(var(--safe-l) + 22px); bottom: calc(var(--safe-b) + 22px); width: 84px; height: 84px; }
  #right { left: calc(var(--safe-l) + 122px); bottom: calc(var(--safe-b) + 22px); width: 84px; height: 84px; }
  #carAct {
    position: fixed; right: calc(var(--safe-r) + 22px); bottom: calc(var(--safe-b) + 132px); height: 46px; padding: 0 18px; border-radius: 23px;
    border: 1.5px solid rgba(255,255,255,0.6); background: rgba(25,30,45,0.72); color: #fff; font-size: 15px; font-weight: 800;
    display: none; align-items: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 12px rgba(0,0,0,0.35);
  }
  body.driving #stick, body.driving #jump { display: none; }
  body.driving #carAct, #carAct.show { display: flex; }
  body.driving #carsBtn { display: none; }

  /* ---------- Підказка зверху ---------- */
  #toast {
    position: fixed; left: 50%; top: calc(var(--safe-t) + 14px); transform: translateX(-50%); max-width: 70vw;
    padding: 9px 16px; border-radius: 16px; background: rgba(20,24,34,0.82); color: #fff; font-size: 14px; font-weight: 700;
    opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; z-index: 30;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="tags"></canvas>

<div id="stick"><div id="knob"></div></div>
<div id="jump">
  <svg class="ico" viewBox="0 0 24 24"><path d="M12 4 L4.5 13 H9.5 V20 H14.5 V13 H19.5 Z" fill="rgba(255,255,255,0.92)"/></svg>
</div>

<button id="carsBtn" type="button" aria-label="Cars">
  <svg viewBox="0 0 48 30" fill="none"><path d="M4 21v-5l4-9h26l6 9h4v5h-4a5 5 0 0 1-10 0H17a5 5 0 0 1-10 0H4z" fill="#fff"/><circle cx="12" cy="22" r="3.4" fill="#2a3045"/><circle cx="35" cy="22" r="3.4" fill="#2a3045"/><path d="M12 9h9v7h-13zM24 9h8l4 7H24z" fill="#8fb4e8"/></svg>
  <span id="carsBtnText">Cars</span>
</button>

<div id="carsPanel" class="hidden">
  <div id="carsHead">
    <button id="carsClose" type="button" aria-label="Close">X</button>
    <div id="carsTitle"></div>
  </div>
  <div id="carsList"></div>
  <button id="spawnBtn" type="button"></button>
</div>

<div id="speedo" aria-label="Speedometer">
  <svg viewBox="0 0 200 176">
    <circle id="spdBg" cx="100" cy="98" r="92"/>
    <circle id="spdTrack" cx="100" cy="98" r="78" stroke-dasharray="367.57 490.09" transform="rotate(135 100 98)"/>
    <circle id="spdBar" cx="100" cy="98" r="78" stroke-dasharray="0 490.09" transform="rotate(135 100 98)"/>
    <text id="spdGear" x="100" y="62">N</text>
    <text id="spdNum" x="100" y="116">0</text>
    <text id="spdUnit" x="100" y="138">KM/H</text>
  </svg>
</div>

<div class="ctl" id="left" aria-label="Left">
  <svg class="ico" viewBox="0 0 24 24"><path d="M15 4 L6 12 L15 20 L15 15 H20 V9 H15 Z" fill="rgba(255,255,255,0.95)"/></svg>
</div>
<div class="ctl" id="right" aria-label="Right">
  <svg class="ico" viewBox="0 0 24 24"><path d="M9 4 L18 12 L9 20 L9 15 H4 V9 H9 Z" fill="rgba(255,255,255,0.95)"/></svg>
</div>
<div class="ctl" id="rev" aria-label="Reverse">
  <svg class="ico" viewBox="0 0 24 24"><path d="M4 9 L12 18 L20 9 H15 V4 H9 V9 Z" fill="rgba(255,255,255,0.95)"/></svg>
</div>
<div class="ctl" id="gas" aria-label="Gas">
  <svg class="ico" viewBox="0 0 24 24"><path d="M12 3 L3.5 13 H9 V21 H15 V13 H20.5 Z" fill="rgba(255,255,255,0.97)"/></svg>
</div>
<button id="carAct" type="button"></button>

<div id="toast"></div>

<!-- Порядок важливий: світ -> фізика -> камера -> переклади -> моделі -> гра -->
<script src="world.js"></script>
<script src="physics.js"></script>
<script src="camera.js"></script>
<script src="i18n.js"></script>
<script src="models.js"></script>
<script src="game.js"></script>
</body>
</html>
