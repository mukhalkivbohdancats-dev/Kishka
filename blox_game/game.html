<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Realistic cars</title>
<style>
  :root {
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #8fc2f5;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  canvas#c, canvas#tags { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #tags { pointer-events: none; }
  .hidden { display: none !important; }

  /* ---------- Джойстик (зліва знизу) і стрибок (справа знизу) ---------- */
  #stick {
    position: fixed; left: calc(var(--safe-l) + 30px); bottom: calc(var(--safe-b) + 22px);
    width: 112px; height: 112px;
    border-radius: 50%; background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.38); touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%;
    border-radius: 50%; background: rgba(255,255,255,0.52); border: 2px solid rgba(255,255,255,0.7); will-change: transform;
  }
  #jump {
    position: fixed; right: calc(var(--safe-r) + 30px); bottom: calc(var(--safe-b) + 30px);
    width: 88px; height: 88px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.45); touch-action: none;
  }
  #jump.down { background: rgba(255,255,255,0.42); }
  .ico { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); pointer-events: none; }

  /* ---------- Кнопка «Cars» (зверху, у ряду з меню й чатом) ---------- */
  #carsBtn {
    position: fixed; left: calc(var(--safe-l) + 12px + (var(--topbtn) + 10px) * 2); top: calc(var(--safe-t) + 10px);
    width: var(--topbtn); height: var(--topbtn); border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.5);
    background: linear-gradient(160deg, rgba(60,70,95,0.78), rgba(25,30,45,0.78));
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; font-weight: 700; letter-spacing: .2px; padding: 0; touch-action: manipulation; cursor: pointer;
  }
  #carsBtn svg { width: 32px; height: 22px; }
  #carsBtn:active { transform: scale(0.93); }

  /* ---------- Вікно вибору машин: велике плаваюче, напівпрозоре, по центру, НЕ на весь екран ---------- */
  /* Без CSS min()/clamp(): старі Android WebView їх не розуміють, і вікно ставало завтовшки кілька міліметрів.
     Розмір задає ще й JS (layoutPanel у game.js) у пікселях. */
  #carsPanel {
    position: fixed; left: 0; right: 0; top: 0; bottom: 0; margin: auto;
    width: 84%; max-width: 980px; min-width: 560px; height: 80%; max-height: 620px; min-height: 300px; box-sizing: border-box;
    padding: 14px 18px 16px; border-radius: 28px;
    display: flex; flex-direction: column; gap: 10px;
    background: rgba(16, 19, 28, 0.62);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255,255,255,0.3); box-shadow: 0 14px 50px rgba(0,0,0,0.5);
    color: #fff; touch-action: pan-y; z-index: 20;
    animation: pop .2s ease-out;
  }
  #carsPanel.hidden { display: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  #carsHead { position: relative; flex: none; height: 46px; display: flex; align-items: center; justify-content: center; }
  #carsTitle { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  #carsClose {
    position: absolute; left: 0; top: 1px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85);
    background: #e5484d; color: #fff; font-size: 22px; font-weight: 900; line-height: 1; padding: 0; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  #carsClose:active { transform: scale(0.92); }
  #carsList { flex: 1 1 auto; min-height: 0; display: flex; gap: 14px; align-items: stretch; overflow-x: auto; overflow-y: hidden; padding: 2px; }
  .card {
    flex: 1 1 0%; min-width: 190px; box-sizing: border-box; padding: 12px; border-radius: 22px;
    background: rgba(255,255,255,0.10); border: 2.5px solid rgba(255,255,255,0.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; touch-action: manipulation;
    transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; min-height: 0;
  }
  .card.sel { background: rgba(255,255,255,0.22); border-color: #4be36b; transform: translateY(-3px); box-shadow: 0 0 0 3px rgba(75,227,107,0.28), 0 8px 22px rgba(0,0,0,0.35); }
  .card .pvw { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .card img.pv { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .card .nm { flex: none; display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; }
  .card .nm svg { width: 30px; height: 19px; flex: none; }
  .card .ht { flex: none; font-size: 13px; opacity: .82; text-align: center; min-height: 16px; }
  .card .st { flex: none; font-size: 12px; font-weight: 700; color: #9bf0ad; min-height: 15px; }

  /* Велика зелена кнопка Spawn: пульсує й «блищить», вдавлюється при натисканні */
  #spawnBtn {
    position: relative; flex: none; width: 100%; height: 62px; border: 0; border-radius: 20px; overflow: hidden;
    font-size: 23px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #fff; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(180deg, #4ee06a, #1fae3d);
    box-shadow: 0 5px 0 #137a2a, 0 10px 22px rgba(0,0,0,0.38);
    text-shadow: 0 2px 3px rgba(0,0,0,0.35);
    animation: spawnPulse 1.5s ease-in-out infinite;
    transition: transform .08s, box-shadow .08s;
  }
  #spawnBtn::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-18deg); animation: spawnShine 2.4s ease-in-out infinite;
  }
  #spawnBtn:active, #spawnBtn.pressed { transform: translateY(4px) scale(0.985); box-shadow: 0 1px 0 #137a2a, 0 4px 10px rgba(0,0,0,0.35); }
  @keyframes spawnPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
  @keyframes spawnShine { 0% { left: -60%; } 55%, 100% { left: 130%; } }

  /* ---------- Спідометр: між кнопками повороту (ліворуч) і газу (праворуч) ---------- */
  #speedo {
    position: fixed; left: 50%; bottom: calc(var(--safe-b) + 14px); transform: translateX(-50%);
    width: 190px; height: 167px; display: none; pointer-events: none; z-index: 5;
  }
  @media (max-width: 760px) { #speedo { width: 140px; height: 123px; } }
  body.driving #speedo { display: block; }
  #speedo svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #spdBg { fill: rgba(10,14,24,0.5); }
  #spdTrack { fill: none; stroke: rgba(255,255,255,0.22); stroke-width: 11; stroke-linecap: round; }
  #spdBar { fill: none; stroke: #5bd36f; stroke-width: 11; stroke-linecap: round; }
  #spdNum { fill: #fff; font-weight: 800; font-size: 56px; text-anchor: middle; font-family: inherit; }
  #spdUnit { fill: rgba(255,255,255,0.82); font-weight: 700; font-size: 15px; text-anchor: middle; letter-spacing: 1px; }
  #spdGear { fill: #ffd24a; font-weight: 800; font-size: 19px; text-anchor: middle; }
  .spdTick { stroke: rgba(255,255,255,0.5); stroke-width: 2; }

  /* ---------- Керування машиною ---------- */
  .ctl {
    position: fixed; border-radius: 50%; display: none; touch-action: none;
    background: rgba(255,255,255,0.20); border: 2px solid rgba(255,255,255,0.5);
  }
  .ctl.down { background: rgba(255,255,255,0.46); }
  body.driving .ctl { display: block; }
  #gas { right: calc(var(--safe-r) + 22px); bottom: calc(var(--safe-b) + 22px); width: 96px; height: 96px; background: rgba(80,210,110,0.30); border-color: rgba(150,255,170,0.8); }
  #gas.down { background: rgba(80,210,110,0.62); }
  #rev { right: calc(var(--safe-r) + 134px); bottom: calc(var(--safe-b) + 22px); width: 80px; height: 80px; }
  #hand { right: calc(var(--safe-r) + 226px); bottom: calc(var(--safe-b) + 22px); width: 66px; height: 66px; display: none; }
  body.driving #hand { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 24px; }
  #flipBtn {
    position: fixed; right: calc(var(--safe-r) + 22px); bottom: calc(var(--safe-b) + 186px); height: 46px; padding: 0 18px; border-radius: 23px;
    border: 1.5px solid rgba(255,255,255,0.6); background: rgba(229,72,77,0.88); color: #fff; font-size: 15px; font-weight: 800;
    display: none; align-items: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 12px rgba(0,0,0,0.35); z-index: 6;
  }
  #flipBtn.show { display: flex; }
  #flipBtn .flipIco { width: 22px; height: 22px; margin-right: 8px; flex: none; }
  #left { left: calc(var(--safe-l) + 22px); bottom: calc(var(--safe-b) + 22px); width: 84px; height: 84px; }
  #right { left: calc(var(--safe-l) + 122px); bottom: calc(var(--safe-b) + 22px); width: 84px; height: 84px; }
  #carAct {
    position: fixed; right: calc(var(--safe-r) + 22px); bottom: calc(var(--safe-b) + 132px); height: 46px; padding: 0 18px; border-radius: 23px;
    border: 1.5px solid rgba(255,255,255,0.6); background: rgba(25,30,45,0.72); color: #fff; font-size: 15px; font-weight: 800;
    display: none; align-items: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 12px rgba(0,0,0,0.35);
  }
  body.driving #stick, body.driving #jump { display: none; }
  body.driving #carAct, #carAct.show { display: flex; }
  body.driving #carsBtn { display: none; }

  /* ---------- Підказка зверху ---------- */
  #toast {
    position: fixed; left: 50%; top: calc(var(--safe-t) + 14px); transform: translateX(-50%); max-width: 70vw;
    padding: 9px 16px; border-radius: 16px; background: rgba(20,24,34,0.82); color: #fff; font-size: 14px; font-weight: 700;
    opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; z-index: 30;
  }
  #toast.show { opacity: 1; }

  /* ================= Нові елементи: чат, HP, код-панель, кнопка дії, напис ядерної тривоги ================= */
  :root { --topbtn: 62px; }           /* розмір круглих кнопок угорі зліва (меню — у застосунку, чат — тут); веб-версія ставить 46px */
  @media (max-height: 459px) { :root { --topbtn: 52px; } }      /* те саме правило, що в застосунку (Bloxmenu.kt: екран нижче 460dp -> кнопка 52dp) */

  /* ---------- Чат: зверху ліворуч, під кнопками. Без вкладок «Here / Global» і без мікрофона ---------- */
  #chatBtn {
    position: fixed; left: calc(var(--safe-l) + 12px + var(--topbtn) + 10px); top: calc(var(--safe-t) + 10px);
    width: var(--topbtn); height: var(--topbtn); border-radius: 50%; border: 0; padding: 0; cursor: pointer; touch-action: manipulation;
    background: rgba(20,22,26,0.86); box-shadow: 0 3px 10px rgba(0,0,0,0.35); z-index: 12;
    display: flex; align-items: center; justify-content: center;
  }
  #chatBtn svg { width: 46%; height: 46%; }
  #chatBtn.on { background: rgba(48,52,60,0.92); }
  #chatBtn:active { transform: scale(0.93); }
  #chatPanel {
    position: fixed; left: calc(var(--safe-l) + 12px); top: calc(var(--safe-t) + 10px + var(--topbtn) + 10px);
    width: 340px; max-width: 46vw; box-sizing: border-box; z-index: 11;
    background: rgba(18,20,24,0.62); border-radius: 12px; overflow: hidden; color: #fff;
    display: flex; flex-direction: column; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  #chatPanel.hidden { display: none; }
  #chatList { height: 116px; overflow-y: auto; padding: 8px 10px 4px; font-size: 14px; line-height: 1.32; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  #chatList .cm { margin-bottom: 3px; word-wrap: break-word; overflow-wrap: anywhere; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
  #chatList .cm b { font-weight: 800; }
  #chatInput {
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
    margin: 0 8px 8px; height: 38px; box-sizing: border-box; border: 0; border-radius: 19px; padding: 0 14px;
    background: rgba(10,12,16,0.7); color: #fff; font-size: 15px; outline: none; font-family: inherit;
  }
  #chatInput::placeholder { color: rgba(255,255,255,0.55); }

  /* ---------- Смужка здоров'я: зверху праворуч, як у Roblox. Колір задає JS: червоний -> зелений ---------- */
  #hp {
    position: fixed; right: calc(var(--safe-r) + 16px); top: calc(var(--safe-t) + 16px); width: 168px; height: 18px; box-sizing: border-box;
    border: 2.5px solid rgba(255,255,255,0.92); border-radius: 10px; background: rgba(0,0,0,0.5); overflow: hidden; z-index: 12;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); pointer-events: none;
  }
  #hpFill { height: 100%; width: 100%; background: hsl(120,82%,46%); transition: width .18s ease-out, background-color .18s; }
  #hurt { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(220,0,0,0.75) 100%); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 13; }

  /* ---------- Код-панель: НЕ на весь екран, хрестик зверху справа ---------- */
  #kpModal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 262px; box-sizing: border-box; z-index: 25;
    padding: 12px 14px 14px; border-radius: 22px; color: #fff; touch-action: manipulation;
    background: rgba(18,21,30,0.9); border: 1.5px solid rgba(255,255,255,0.28); box-shadow: 0 14px 40px rgba(0,0,0,0.55);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: pop .18s ease-out;
  }
  #kpModal.hidden { display: none; }
  #kpHead { position: relative; height: 38px; display: flex; align-items: center; justify-content: center; }
  #kpTitle { font-size: 17px; font-weight: 800; letter-spacing: .3px; }
  #kpClose {
    position: absolute; right: -2px; top: 0; width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85);
    background: #e5484d; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation;
  }
  #kpClose svg { width: 16px; height: 16px; }
  #kpDisp {
    margin: 8px 0 4px; height: 46px; border-radius: 12px; background: #0d2418; border: 1.5px solid #1d4a31; color: #7dffa6;
    font-family: 'Courier New', monospace; font-size: 28px; font-weight: 800; letter-spacing: 3px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #kpMsg { height: 20px; text-align: center; font-size: 14px; font-weight: 700; color: #9bf0ad; }
  #kpMsg.bad { color: #ff6b6b; }
  #kpKeys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  #kpKeys button {
    height: 52px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.12); color: #fff;
    font-size: 24px; font-weight: 800; cursor: pointer; touch-action: manipulation; padding: 0; display: flex; align-items: center; justify-content: center;
  }
  #kpKeys button:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
  #kpKeys button.kx { background: rgba(229,72,77,0.55); }
  #kpKeys button.kv { background: rgba(40,190,90,0.6); }
  #kpKeys svg { width: 24px; height: 24px; }

  /* ---------- Кнопка дії поруч із панеллю чи червоною кнопкою ---------- */
  #useBtn {
    position: fixed; right: calc(var(--safe-r) + 22px); bottom: calc(var(--safe-b) + 240px); height: 54px; padding: 0 22px; border-radius: 27px;
    border: 2px solid rgba(255,255,255,0.75); background: rgba(25,30,45,0.86); color: #fff; font-size: 17px; font-weight: 900; letter-spacing: .5px;
    display: none; align-items: center; cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 14px rgba(0,0,0,0.4); z-index: 8;
  }
  #useBtn.show { display: flex; }
  #useBtn.red { background: linear-gradient(180deg, #ff4a3d, #c4160c); border-color: #fff; animation: spawnPulse 1s ease-in-out infinite; }
  #useBtn:active { transform: scale(0.95); }

  /* ---------- Ядерна тривога: напис між верхом і серединою екрана, праворуч від нього відлік 59С -> 0 ---------- */
  #nukeBanner {
    position: fixed; left: 50%; top: 16%; transform: translate(-50%, -50%); z-index: 40; display: none; align-items: center; gap: 22px; pointer-events: none;
    max-width: 96vw; white-space: nowrap;
  }
  #nukeBanner.show { display: flex; animation: nukeIn .45s ease-out; }
  @keyframes nukeIn { from { opacity: 0; transform: translate(-50%, -80%) scale(.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  #nbText, #nbCount {
    font-family: Impact, 'Haettenschweiler', 'Arial Black', 'Arial Narrow Bold', 'Roboto Condensed', sans-serif; font-weight: 900; text-transform: uppercase;
    letter-spacing: 2px; text-shadow: 0 0 14px rgba(255,40,0,0.85), 0 3px 0 rgba(0,0,0,0.75), 0 0 34px rgba(255,120,0,0.55);
  }
  #nbText { font-size: 30px; color: #fff3e0; animation: nukePulse 1s ease-in-out infinite; }
  #nbCount { font-size: 44px; color: #ff3d2e; min-width: 92px; text-align: left; }
  #nbCount.low { animation: nukePulse .5s ease-in-out infinite; color: #ff1a1a; }
  @keyframes nukePulse { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
  @media (max-width: 760px) { #nbText { font-size: 20px; } #nbCount { font-size: 30px; min-width: 66px; } #nukeBanner { gap: 12px; } }
  #flashOv { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #fff6e0; opacity: 0; pointer-events: none; z-index: 45; }

  /* Під час кінематографічної камери ховаємо кнопки керування */
  body.cine #stick, body.cine #jump, body.cine .ctl, body.cine #carAct, body.cine #carsBtn, body.cine #speedo, body.cine #useBtn, body.cine #flipBtn { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="tags"></canvas>

<div id="stick"><div id="knob"></div></div>
<div id="jump">
  <svg class="ico" viewBox="0 0 24 24"><path d="M12 4 L4.5 13 H9.5 V20 H14.5 V13 H19.5 Z" fill="rgba(255,255,255,0.92)"/></svg>
</div>

<button id="carsBtn" type="button" aria-label="Cars">
  <svg viewBox="0 0 48 30" fill="none"><path d="M4 21v-5l4-9h26l6 9h4v5h-4a5 5 0 0 1-10 0H17a5 5 0 0 1-10 0H4z" fill="#fff"/><circle cx="12" cy="22" r="3.4" fill="#2a3045"/><circle cx="35" cy="22" r="3.4" fill="#2a3045"/><path d="M12 9h9v7h-13zM24 9h8l4 7H24z" fill="#8fb4e8"/></svg>
  <span id="carsBtnText">Cars</span>
</button>

<div id="carsPanel" class="hidden">
  <div id="carsHead">
    <button id="carsClose" type="button" aria-label="Close">X</button>
    <div id="carsTitle"></div>
  </div>
  <div id="carsList"></div>
  <button id="spawnBtn" type="button"></button>
</div>

<div id="speedo" aria-label="Speedometer">
  <svg viewBox="0 0 200 176">
    <circle id="spdBg" cx="100" cy="98" r="92"/>
    <circle id="spdTrack" cx="100" cy="98" r="78" stroke-dasharray="367.57 490.09" transform="rotate(135 100 98)"/>
    <circle id="spdBar" cx="100" cy="98" r="78" stroke-dasharray="0 490.09" transform="rotate(135 100 98)"/>
    <text id="spdGear" x="100" y="62">N</text>
    <text id="spdNum" x="100" y="116">0</text>
    <text id="spdUnit" x="100" y="138">KM/H</text>
  </svg>
</div>

<div class="ctl" id="left" aria-label="Left">
  <svg class="ico" viewBox="0 0 24 24"><path d="M15 4 L6 12 L15 20 L15 15 H20 V9 H15 Z" fill="rgba(255,255,255,0.95)"/></svg>
</div>
<div class="ctl" id="right" aria-label="Right">
  <svg class="ico" viewBox="0 0 24 24"><path d="M9 4 L18 12 L9 20 L9 15 H4 V9 H9 Z" fill="rgba(255,255,255,0.95)"/></svg>
</div>
<div class="ctl" id="rev" aria-label="Reverse">
  <svg class="ico" viewBox="0 0 24 24"><path d="M4 9 L12 18 L20 9 H15 V4 H9 V9 Z" fill="rgba(255,255,255,0.95)"/></svg>
</div>
<div class="ctl" id="hand" aria-label="Drift (P)">P</div>
<button id="flipBtn" type="button"><svg class="flipIco" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.7-6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M20.6 3.2v5.4h-5.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="flipTxt"></span></button>
<div class="ctl" id="gas" aria-label="Gas">
  <svg class="ico" viewBox="0 0 24 24"><path d="M12 3 L3.5 13 H9 V21 H15 V13 H20.5 Z" fill="rgba(255,255,255,0.97)"/></svg>
</div>
<button id="carAct" type="button"></button>

<div id="toast"></div>

<!-- ===== Нові елементи (керує features.js) ===== -->
<button id="chatBtn" type="button" aria-label="Chat" class="on">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4.2V17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff"/><path d="M6.5 8.2h11M6.5 11.8h7" stroke="#16181c" stroke-width="1.7" stroke-linecap="round"/></svg>
</button>
<div id="chatPanel">
  <div id="chatList" aria-live="polite"></div>
  <input id="chatInput" type="text" maxlength="160" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="Tap here to chat">
</div>

<div id="hp" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100"><div id="hpFill"></div></div>
<div id="hurt"></div>

<div id="kpModal" class="hidden" role="dialog">
  <div id="kpHead">
    <div id="kpTitle">Door code</div>
    <button id="kpClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg></button>
  </div>
  <div id="kpDisp" class="empty"></div>
  <div id="kpMsg" class="kpmsg"></div>
  <div id="kpKeys">
    <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
    <button type="button" data-k="x" class="kx" aria-label="Erase"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></button>
    <button type="button" data-k="0">0</button>
    <button type="button" data-k="v" class="kv" aria-label="Enter"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<button id="useBtn" type="button"><span id="useTxt"></span></button>

<div id="nukeBanner"><div id="nbText"></div><div id="nbCount"></div></div>
<div id="flashOv"></div>
